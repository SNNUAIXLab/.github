  <title id="logo-title">AIxLab · 人工智能安全实验室标识</title>
  <desc id="logo-desc">保留实验室盾形。字标采用独立构造的双贝塞尔曲带，青色上升曲带连续变细，回落曲带保持稳定宽度；曲带宽度以黄金比例关联。字标前倾八度，总设计宽度保持盾宽的黄金比例。</desc>
